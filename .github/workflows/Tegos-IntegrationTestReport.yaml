name: 'Integration Test Report'

# Companion workflow for consultant-driven integration test builds.
#
# The tegos-project-automation bot dispatches this workflow on the default
# branch. The prepare job creates an integration branch, sequentially merges
# all selected branches, resolves eligible XLIFF-only conflicts by textual
# union, marks changed apps, commits metadata, and dispatches `CICD.yaml` once.
# The report job runs once that CI/CD run completes and:
#   - on success: attaches ONLY the changed apps as an artifact and comments a
#     download link on the primary issue, cross-links the other test issues.
#   - on failure: comments the failure on the primary issue and @-mentions the
#     test assignee + the last task developer.
# Finally it deletes the integration branch.
#
# Requires two secrets pointing at the same GitHub App used by the automation
# (permissions: Contents RW, Issues RW, Actions RW):
#   ITB_APP_ID, ITB_APP_PRIVATE_KEY

on:
  workflow_dispatch:
    inputs:
      integration_branch:
        description: Integration branch created by the automation
        required: true
        type: string
      branches_json:
        description: Ordered JSON array of development branches
        required: true
        type: string
      metadata_json:
        description: JSON metadata written to the integration branch
        required: true
        type: string
      test_numbers_json:
        description: JSON array of test issue numbers
        required: true
        type: string
      default_branch:
        description: Repository default branch
        required: true
        type: string
      eta_minutes:
        description: Estimated CI duration in minutes
        required: true
        type: string
  workflow_run:
    # AL-Go's CI/CD workflow is named ' CI/CD' (with a leading space). Match both
    # the current quirky name and a future cleaned-up "CI/CD" to stay robust.
    workflows: [" CI/CD", "CI/CD"]
    types: [completed]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: itb-${{ github.event_name == 'workflow_dispatch' && inputs.integration_branch || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ITB_APP_ID }}
          private-key: ${{ secrets.ITB_APP_PRIVATE_KEY }}

      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Prepare integration branch
        id: prepare
        continue-on-error: true
        env:
          INTEGRATION_BRANCH: ${{ inputs.integration_branch }}
          BRANCHES_JSON: ${{ inputs.branches_json }}
          METADATA_JSON: ${{ inputs.metadata_json }}
          TEST_NUMBERS_JSON: ${{ inputs.test_numbers_json }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          RESULT_PATH: ${{ runner.temp }}/itb-prepare-result.json
        shell: pwsh
        run: |
          pwsh -NoProfile -File .github/scripts/Prepare-IntegrationTestBuild.ps1 `
            -IntegrationBranch $env:INTEGRATION_BRANCH `
            -BranchesJson $env:BRANCHES_JSON `
            -MetadataJson $env:METADATA_JSON `
            -TestNumbersJson $env:TEST_NUMBERS_JSON `
            -DefaultBranch $env:DEFAULT_BRANCH `
            -ResultPath $env:RESULT_PATH
          $scriptExit = $LASTEXITCODE
          if (Test-Path -LiteralPath $env:RESULT_PATH) {
            $result = Get-Content -LiteralPath $env:RESULT_PATH -Raw | ConvertFrom-Json
            "status=$($result.status)" | Out-File $env:GITHUB_OUTPUT -Append
          }
          exit $scriptExit

      - name: Report preparation failure
        if: steps.prepare.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RESULT_PATH: ${{ runner.temp }}/itb-prepare-result.json
          METADATA_JSON: ${{ inputs.metadata_json }}
          INTEGRATION_BRANCH: ${{ inputs.integration_branch }}
          REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $metadata = $env:METADATA_JSON | ConvertFrom-Json
          $result = if (Test-Path -LiteralPath $env:RESULT_PATH) {
            Get-Content -LiteralPath $env:RESULT_PATH -Raw | ConvertFrom-Json
          } else {
            [pscustomobject]@{ message = 'Unbekannter Vorbereitungsfehler'; conflictBranch = ''; conflictFiles = @() }
          }
          $failedBranch = if ($result.conflictBranch) { [string]$result.conflictBranch } else { $env:INTEGRATION_BRANCH }
          $failedBranch = $failedBranch -replace '[\r\n`]', '_'
          $message = ([string]$result.message -replace '[\r\n]', ' ').Replace('`', "'")
          if ($message.Length -gt 1000) { $message = $message.Substring(0, 1000) }
          $mentions = @($metadata.notifyHandles |
            Where-Object { $_ -match '^[A-Za-z0-9-]+$' } |
            ForEach-Object { "@$_" }) -join ' '
          $files = @($result.conflictFiles | ForEach-Object { ([string]$_ -replace '[\r\n`]', '_') })
          $fileLines = if ($files.Count -gt 0) {
            "`n`nKonfliktdateien:`n" + (($files | ForEach-Object { "- ``$_``" }) -join "`n")
          } else { '' }
          $body = @"
          ❌ **Integrations-Branch konnte nicht erstellt werden**

          Der Branch ``$failedBranch`` konnte nicht in den Integrations-Branch zusammengeführt werden.
          Meldung: $message$fileLines

          Es wurde kein CI/CD-Build gestartet. Bitte den Konflikt manuell auflösen und den Testbuild erneut anstoßen.

          $mentions
          "@
          gh issue comment $metadata.primaryIssue --repo $env:REPO --body $body

      - name: Report ETA and dispatch CI/CD
        id: dispatch
        if: steps.prepare.outcome == 'success' && steps.prepare.outputs.status == 'prepared'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          METADATA_JSON: ${{ inputs.metadata_json }}
          BRANCHES_JSON: ${{ inputs.branches_json }}
          ETA_MINUTES: ${{ inputs.eta_minutes }}
          INTEGRATION_BRANCH: ${{ inputs.integration_branch }}
          REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $metadata = $env:METADATA_JSON | ConvertFrom-Json
          $branches = @($env:BRANCHES_JSON | ConvertFrom-Json -NoEnumerate)
          $displayBranches = @($branches | ForEach-Object { ([string]$_ -replace '[\r\n`]', '_') })
          if ($env:ETA_MINUTES -notmatch '^[0-9]+$') { throw 'Invalid ETA.' }
          $testList = @($metadata.primaryIssue) + @($metadata.otherIssues) | Sort-Object -Unique
          $body = @"
          🔧 **Integrations-Testbuild gestartet.**

          Enthaltene Tests: $(($testList | ForEach-Object { "#$_" }) -join ', ')
          Branches: $(($displayBranches | ForEach-Object { "``$_``" }) -join ', ')

          ⏱️ Voraussichtliche Dauer: **~$($env:ETA_MINUTES) Min**. Die fertige App wird anschließend hier verlinkt.
          "@
          gh issue comment $metadata.primaryIssue --repo $env:REPO --body $body
          gh api "repos/$($env:REPO)/actions/workflows/CICD.yaml/dispatches" `
            --method POST --field "ref=$($env:INTEGRATION_BRANCH)" | Out-Null

      - name: Report CI/CD dispatch failure
        if: steps.dispatch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          METADATA_JSON: ${{ inputs.metadata_json }}
          INTEGRATION_BRANCH: ${{ inputs.integration_branch }}
          REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $metadata = $env:METADATA_JSON | ConvertFrom-Json
          $mentions = @($metadata.notifyHandles |
            Where-Object { $_ -match '^[A-Za-z0-9-]+$' } |
            ForEach-Object { "@$_" }) -join ' '
          $body = @"
          ❌ **Integrations-Testbuild konnte nicht gestartet werden**

          Der vorbereitete Integrations-Branch ``$($env:INTEGRATION_BRANCH)`` konnte nicht an ``CICD.yaml`` übergeben werden und wird gelöscht.

          $mentions
          "@
          gh issue comment $metadata.primaryIssue --repo $env:REPO --body $body

      - name: Clean up failed preparation
        if: always() && (steps.prepare.outcome == 'failure' || steps.dispatch.outcome == 'failure')
        env:
          INTEGRATION_BRANCH: ${{ inputs.integration_branch }}
        shell: pwsh
        run: |
          if ($env:INTEGRATION_BRANCH -match '^test-branch/itb-[0-9]+-[0-9]+$') {
            git push origin --delete $env:INTEGRATION_BRANCH 2>$null
          }
          exit 0

  report:
    if: github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'test-branch/itb-')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ITB_APP_ID }}
          private-key: ${{ secrets.ITB_APP_PRIVATE_KEY }}

      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Read build metadata
        id: meta
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path .itb -Filter *.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $file) {
            Write-Host "No .itb metadata file found on branch."
            "found=false" | Out-File $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $m = Get-Content $file.FullName -Raw | ConvertFrom-Json
          "found=true"                              | Out-File $env:GITHUB_OUTPUT -Append
          "primary=$($m.primaryIssue)"              | Out-File $env:GITHUB_OUTPUT -Append
          "others=$(($m.otherIssues)   -join ',')"  | Out-File $env:GITHUB_OUTPUT -Append
          "handles=$(($m.notifyHandles) -join ',')" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Report build failure
        if: steps.meta.outputs.found == 'true' && github.event.workflow_run.conclusion != 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PRIMARY: ${{ steps.meta.outputs.primary }}
          HANDLES: ${{ steps.meta.outputs.handles }}
          REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $mentions = ($env:HANDLES.Split(',', [StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { "@$_" }) -join ' '
          $body = @"
          ❌ **Integrations-Testbuild fehlgeschlagen**

          Der CI-Build ist mit dem Ergebnis ``$($env:CONCLUSION)`` beendet worden.

          Run-Details: $($env:RUN_URL)

          $mentions
          "@
          gh issue comment $env:PRIMARY --repo $env:REPO --body $body

      - name: Determine changed apps
        id: changed
        if: steps.meta.outputs.found == 'true' && github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO_NAME: ${{ github.event.repository.name }}
        shell: pwsh
        run: |
          # The bot recorded the marked test apps (name + publisher) in the
          # metadata file, so we select exactly those – no git diff needed.
          $file = Get-ChildItem -Path .itb -Filter *.json | Select-Object -First 1
          $changedApps = @((Get-Content $file.FullName -Raw | ConvertFrom-Json).apps)
          if (-not $changedApps -or $changedApps.Count -eq 0) {
            Write-Host "No apps recorded in metadata."
            "has_apps=false" | Out-File $env:GITHUB_OUTPUT -Append
            exit 0
          }

          # Download the CI/CD artifacts and keep only the recorded apps' .app files.
          New-Item -ItemType Directory -Force -Path changed-apps | Out-Null
          gh run download $env:RUN_ID --dir _artifacts 2>$null
          $appFiles = Get-ChildItem -Path _artifacts -Recurse -Filter *.app -ErrorAction SilentlyContinue
          $kept = @()
          $versions = @()
          foreach ($f in $appFiles) {
            foreach ($ca in $changedApps) {
              # Literal match on "<publisher>_<name>_" against the .app filename.
              $needle = "{0}_{1}_" -f $ca.publisher, $ca.name
              $matchIndex = $f.BaseName.IndexOf($needle, [StringComparison]::Ordinal)
              if ($matchIndex -ge 0) {
                $version = $f.BaseName.Substring($matchIndex + $needle.Length)
                if ([string]::IsNullOrWhiteSpace($version)) { continue }
                Copy-Item $f.FullName -Destination changed-apps -Force
                $kept += $f.Name
                $versions += $version
                break
              }
            }
          }
          $kept = $kept | Sort-Object -Unique
          if (-not $kept) {
            Write-Host "No matching .app artifacts for the recorded apps."
            "has_apps=false" | Out-File $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $versionComponent = ($versions | Sort-Object -Unique) -join '+'
          $artifactName = "$($env:REPO_NAME)-Testapp-$versionComponent"
          ($changedApps | ForEach-Object { "- {0} ({1})" -f $_.name, $_.publisher }) -join "`n" | Set-Content changed-apps/_apps.md
          "has_apps=true" | Out-File $env:GITHUB_OUTPUT -Append
          "artifact_name=$artifactName" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Upload changed apps
        id: upload
        if: steps.changed.outputs.has_apps == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.changed.outputs.artifact_name }}
          path: changed-apps/*.app
          if-no-files-found: error

      - name: Comment app link and cross-link
        if: steps.changed.outputs.has_apps == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PRIMARY: ${{ steps.meta.outputs.primary }}
          OTHERS: ${{ steps.meta.outputs.others }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_NAME: ${{ steps.changed.outputs.artifact_name }}
        shell: pwsh
        run: |
          $appList = if (Test-Path changed-apps/_apps.md) { Get-Content changed-apps/_apps.md -Raw } else { "" }
          $body = @"
          ✅ **Test-App bereit**

          Geänderte Apps in diesem Integrations-Build:
          $appList

          📦 Download (Artefakt ``$($env:ARTIFACT_NAME)``): $($env:RUN_URL)
          "@
          $commentUrl = gh issue comment $env:PRIMARY --repo $env:REPO --body $body
          Write-Host "Primary comment: $commentUrl"

          foreach ($o in $env:OTHERS.Split(',', [StringSplitOptions]::RemoveEmptyEntries)) {
            $refBody = "🔗 Diese Test-App wurde gemeinsam mit weiteren Tests gebaut. Download & Details siehe: $commentUrl"
            gh issue comment $o --repo $env:REPO --body $refBody
          }

      - name: Delete integration branch
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: pwsh
        run: |
          git push origin --delete $env:HEAD_BRANCH 2>$null
          exit 0
